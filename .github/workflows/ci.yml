name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Как на хостинге: PHP 8.4 с GD (WebP), Imagick, intl.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, intl, mbstring, pdo_sqlite, zip, fileinfo, exif
          coverage: none

      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      # Конвейер PDF меню рисует страницы Ghostscript'ом, как на хостинге; без него тесты меню пропускаются
      - name: Ghostscript
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest
        run: vendor/bin/pest --compact

  # Скрипты сайта (газета, лупа, галерея, плашка акций) — без зависимостей, на чистом Node
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm test
